<circle cx="1126.0" cy="100" r="19" fill="#0d9488"/>
<text x="1126.0" y="107" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">5</text>
<text x="1126.0" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">توضيح المتطلبات</text>
