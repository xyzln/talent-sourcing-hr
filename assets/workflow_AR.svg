<circle cx="622.0" cy="100" r="19" fill="#0d9488"/>
<text x="622.0" y="107" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
<text x="622.0" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">الوظيفة → الوكيل</text>
<text x="622.0" y="184" text-anchor="middle" font-size="13.5" fill="#475569">ترجمة العناصر إلى</text>
<text x="622.0" y="206" text-anchor="middle" font-size="13.5" fill="#475569">شخصية ومهارات</text>
<path d="M 760 150.0 L 742 159.0 L 760 168.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
