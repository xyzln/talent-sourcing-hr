<circle cx="874.0" cy="100" r="19" fill="#0d9488"/>
<text x="874.0" y="107" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
<text x="874.0" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">دراسة الوظيفة</text>
<text x="874.0" y="184" text-anchor="middle" font-size="13.5" fill="#475569">المسؤوليات والمتطلبات</text>
<text x="874.0" y="206" text-anchor="middle" font-size="13.5" fill="#475569">والمؤشرات والأدوات</text>
